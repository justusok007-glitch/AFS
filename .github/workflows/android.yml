name: Android APK
on:
  workflow_dispatch:
    inputs:
      softinput:
        description: 'Keyboard mode: adjustResize or adjustPan'
        default: 'adjustResize'
      stock:
        description: 'Test build without the screen-edge patch (true/false)'
        default: 'false'
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx vite build
      - name: Add Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Icons, version, permissions
        run: |
          pip install pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          import os
          res = 'android/app/src/main/res'
          src = Image.open('firebase/app-icon.png').convert('RGB')
          bg = src.getpixel((6, 6))
          bghex = '#%02X%02X%02X' % bg
          legacy = {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}
          for d, px in legacy.items():
              folder = f'{res}/mipmap-{d}'
              os.makedirs(folder, exist_ok=True)
              full = src.resize((px, px), Image.LANCZOS)
              full.save(f'{folder}/ic_launcher.png')
              big = full.resize((px * 4, px * 4), Image.LANCZOS)
              mask = Image.new('L', (px * 4, px * 4), 0)
              ImageDraw.Draw(mask).ellipse((0, 0, px * 4 - 1, px * 4 - 1), fill=255)
              rnd = Image.new('RGBA', (px * 4, px * 4), (0, 0, 0, 0))
              rnd.paste(big, (0, 0), mask)
              rnd.resize((px, px), Image.LANCZOS).save(f'{folder}/ic_launcher_round.png')
              fg = px * 108 // 48
              canvas = Image.new('RGBA', (fg, fg), (0, 0, 0, 0))
              inner = int(fg * 0.84)
              canvas.paste(src.resize((inner, inner), Image.LANCZOS), ((fg - inner) // 2, (fg - inner) // 2))
              canvas.save(f'{folder}/ic_launcher_foreground.png')
          os.makedirs(f'{res}/mipmap-anydpi-v26', exist_ok=True)
          xml = '<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n    <background android:drawable="@color/ic_launcher_background"/>\n    <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n</adaptive-icon>\n'
          for n in ('ic_launcher', 'ic_launcher_round'):
              open(f'{res}/mipmap-anydpi-v26/{n}.xml', 'w').write(xml)
          open(f'{res}/values/ic_launcher_background.xml', 'w').write(f'<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">{bghex}</color>\n</resources>\n')
          PY
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
      - name: Firebase notifications
        run: |
          cp firebase/google-services.json android/app/google-services.json
          python3 - <<'PY'
          import re
          m = 'android/app/src/main/AndroidManifest.xml'
          s = open(m).read()
          if 'POST_NOTIFICATIONS' not in s:
              s = s.replace('</manifest>', '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n</manifest>')
          meta = '<meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="@drawable/ic_stat_notify" />\n        <meta-data android:name="com.google.firebase.messaging.default_notification_color" android:resource="@color/colorPrimary" />\n    </application>'
          if 'default_notification_icon' not in s:
              s = s.replace('</application>', '    ' + meta, 1)
          open(m, 'w').write(s)
          import os
          os.makedirs('android/app/src/main/res/drawable', exist_ok=True)
          open('android/app/src/main/res/drawable/ic_stat_notify.xml', 'w').write("""<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFFFF" android:pathData="M12,22c1.1,0 2,-0.9 2,-2h-4c0,1.1 0.9,2 2,2zM18,16v-5c0,-3.07 -1.63,-5.64 -4.5,-6.32V4c0,-0.83 -0.67,-1.5 -1.5,-1.5s-1.5,0.67 -1.5,1.5v0.68C7.64,5.36 6,7.92 6,11v5l-2,2v1h16v-1l-2,-2z"/>
          </vector>""")
          PY
          grep -c "colorPrimary" android/app/src/main/res/values/colors.xml || true
          sed -i 's/android:windowSoftInputMode="[^"]*"//; s/<activity/<activity android:windowSoftInputMode="${{ inputs.softinput || 'adjustResize' }}"/' android/app/src/main/AndroidManifest.xml
          grep -n "windowSoftInputMode" android/app/src/main/AndroidManifest.xml || true
      - name: Keep app below status bar and above gesture bar
        if: ${{ inputs.stock != 'true' }}
        run: |
          python3 - <<'PY'
          import glob
          f = glob.glob('android/app/src/main/java/**/MainActivity.java', recursive=True)[0]
          pkg = 'pk.alfurqan.okara'
          open(f, 'w').write("""package %s;

          import android.graphics.Color;
          import android.graphics.drawable.ClipDrawable;
          import android.graphics.drawable.ColorDrawable;
          import android.graphics.drawable.LayerDrawable;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.View;
          import androidx.core.graphics.Insets;
          import androidx.core.view.ViewCompat;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WindowCompat.setDecorFitsSystemWindows(getWindow(), false);
                  ClipDrawable top = new ClipDrawable(new ColorDrawable(Color.parseColor("#2E6FD8")), Gravity.TOP, ClipDrawable.VERTICAL);
                  top.setLevel(2500);
                  getWindow().setBackgroundDrawable(new LayerDrawable(new android.graphics.drawable.Drawable[]{new ColorDrawable(Color.parseColor("#F6F8FC")), top}));
                  getWindow().setStatusBarColor(Color.TRANSPARENT);
                  getWindow().setNavigationBarColor(Color.TRANSPARENT);
                  WindowInsetsControllerCompat c = WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());
                  c.setAppearanceLightStatusBars(false);
                  c.setAppearanceLightNavigationBars(true);
                  View content = findViewById(android.R.id.content);
                  ViewCompat.setOnApplyWindowInsetsListener(content, (v, insets) -> {
                      Insets i = insets.getInsets(WindowInsetsCompat.Type.systemBars() | WindowInsetsCompat.Type.displayCutout() | WindowInsetsCompat.Type.ime());
                      v.setPadding(i.left, i.top, i.right, i.bottom);
                      return WindowInsetsCompat.CONSUMED;
                  });
              }
          }
          """ % pkg)
          PY
      - name: Diagnostics
        run: |
          echo "::notice title=gradle::$(grep -nE 'versionCode|versionName|targetSdk|compileSdk' android/app/build.gradle android/variables.gradle | tr '\n' '|')"
          echo "::notice title=main::$(ls android/app/src/main/java/pk/alfurqan/okara/ | tr '\n' ' ') $(head -c 300 android/app/src/main/java/pk/alfurqan/okara/MainActivity.java | tr '\n' ' ')"
          echo "::notice title=styles::$(cat android/app/src/main/res/values/styles.xml | tr '\n' ' ')"
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Sign
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          base64 -d android-signing/test-keystore.b64 > $RUNNER_TEMP/afs.jks
          IN=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          $BT/zipalign -f -p 4 "$IN" $RUNNER_TEMP/aligned.apk
          $BT/apksigner sign --ks $RUNNER_TEMP/afs.jks --ks-key-alias afs --ks-pass pass:AfsOkara2026Key --key-pass pass:AfsOkara2026Key --out AlFurqanSchool.apk $RUNNER_TEMP/aligned.apk
          $BT/apksigner verify AlFurqanSchool.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AlFurqanSchool-apk
          path: AlFurqanSchool.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=apk-latest; if [ "${{ inputs.stock }}" = "true" ]; then TAG=apk-test; fi
          gh release delete $TAG --cleanup-tag --yes || true
          gh release create $TAG AlFurqanSchool.apk --title "Al Furqan School test APK (build ${{ github.run_number }})" --notes "Test build ${{ github.run_number }}" --prerelease
