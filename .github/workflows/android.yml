name: Android APK
on:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx vite build
      - name: Add Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Icons, version, permissions
        run: |
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for s in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${s%%:*}; px=${s##*:}
            for n in ic_launcher ic_launcher_round ic_launcher_foreground; do
              convert public/school-launcher-icon.png -resize ${px}x${px} $RES/mipmap-$d/$n.png
            done
          done
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Sign
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          base64 -d android-signing/test-keystore.b64 > $RUNNER_TEMP/afs.jks
          IN=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          $BT/zipalign -f -p 4 "$IN" $RUNNER_TEMP/aligned.apk
          $BT/apksigner sign --ks $RUNNER_TEMP/afs.jks --ks-key-alias afs --ks-pass pass:AfsOkara2026Key --key-pass pass:AfsOkara2026Key --out AlFurqanSchool.apk $RUNNER_TEMP/aligned.apk
          $BT/apksigner verify AlFurqanSchool.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AlFurqanSchool-apk
          path: AlFurqanSchool.apk
